<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mélange substractif</title>
  <style>
    :root { --gap: 14px; --radius: 14px; }

    /* Fix pour Safari : On assure une hauteur fluide sur html/body */
    html, body {
      margin: 0;
      padding: 0;
      height: auto !important;
      min-height: 100%;
      background: #fff;
      color: #111;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      overflow-x: hidden;
    }

    .wrap { 
      max-width: none; 
      margin: 0; 
      padding: 12px; 
      box-sizing: border-box; 
      display: block; /* Force le flux pour Safari */
    }

    .card {
      border: 1px solid #e7e7e7;
      border-radius: var(--radius);
      padding: 14px;
      box-shadow: 0 6px 18px rgba(0,0,0,.06);
      background: #fff;
    }

    .grid {
      display: grid;
      grid-template-columns: 1.6fr 1fr;
      gap: var(--gap);
      align-items: stretch;
    }
    @media (max-width: 900px){
      .grid{ grid-template-columns: 1fr; }
    }

    .viewer {
      border-radius: calc(var(--radius) + 6px);
      border: 1px solid #ddd;
      background: #fff;
      min-height: 200px;
      aspect-ratio: 21 / 9;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      padding: 12px;
      overflow: hidden;
      position: relative;
    }

    .badge {
      background: rgba(255,255,255,.9);
      border: 1px solid rgba(0,0,0,.08);
      border-radius: 999px;
      padding: 8px 10px;
      font-size: 13px;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      border: 1px solid rgba(0,0,0,.2);
      display: inline-block;
    }

    .controls { display: flex; flex-direction: column; gap: var(--gap); }

    .row {
      display: grid;
      grid-template-columns: 160px 1fr 56px;
      gap: 10px;
      align-items: center;
    }

    .label {
      font-weight: 650;
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    input[type="range"] { width: 100%; }
    .value { text-align: right; font-variant-numeric: tabular-nums; }

    button {
      border: 1px solid #ddd;
      background: #fff;
      padding: 10px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 650;
    }
    button:hover { background: #f6f6f6; }

    .mini { font-size: 12px; opacity: .82; line-height: 1.35; }

    .tabs {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 10px;
    }
    .tab {
      padding: 10px 12px;
      border-radius: 999px;
      border: 1px solid #ddd;
      background: #fff;
      cursor: pointer;
      font-weight: 700;
    }
    .tab.active {
      background: #111;
      color: #fff;
      border-color: #111;
    }

    .imgBox {
      border: 1px dashed #d7d7d7;
      border-radius: 14px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .imgCanvasWrap {
      border: 1px solid #eee;
      border-radius: 14px;
      background: #fafafa;
      max-height: 200px;
      overflow-y: auto;
    }
    canvas {
      display: block;
      width: 100%;
      height: auto;
      cursor: crosshair;
    }

    .wbPanel { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; max-width: 70%; }
    .wbGroup { display: flex; gap: 8px; align-items: center; }
    .wbBtn { padding: 8px 10px; border-radius: 12px; font-weight: 750; }
    .wbRead { font-size: 12px; opacity: .9; font-variant-numeric: tabular-nums; }

    .swatches { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 6px; }

    .colorCard {
      border: 1px solid #e7e7e7;
      border-radius: 14px;
      padding: 10px;
      background: #fff;
      box-shadow: 0 3px 12px rgba(0,0,0,.04);
    }

    .colorHeader { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: nowrap; }

    .colorBtn {
      display: flex; align-items: center; gap: 10px; border: 1px solid #ddd; background: #fff;
      border-radius: 14px; padding: 10px 12px; cursor: pointer; text-align: left;
      flex: 1 1 auto; min-width: 0;
    }
    .colorBtn.selected { border-color: #111; box-shadow: 0 0 0 2px rgba(0,0,0,.08) inset; }

    .chip {
      width: 22px; height: 22px; border-radius: 8px; border: 1px solid rgba(0,0,0,.2);
      flex: 0 0 auto;
    }
    .titleText { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 800; font-size: 13px; }

    .partInline { flex: 0 1 320px; min-width: 0; display: flex; align-items: center; gap: 10px; }
    .partLabel { font-weight: 650; font-size: 12px; opacity: .85; white-space: nowrap; }
    .partRange { flex: 1 1 auto; min-width: 100px; }
    .partPct { width: 44px; text-align: right; font-variant-numeric: tabular-nums; font-weight: 800; font-size: 12px; }

    .delBtn { flex: 0 0 auto; margin-left: auto; padding: 10px 12px; border-radius: 14px; font-weight: 900; }

    .addRow { display: flex; gap: 10px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
    .hidden { display: none !important; }
  </style>
</head>

<body>
  <div class="wrap" id="mainWrap">
    <div class="card">
      <h1 style="margin:0 0 6px 0; font-size:20px;">Mélange substractif</h1>
      <div class="mini">Mode “Couleurs libres” : choisissez une couleur et cliquez dans l'image.</div>
      <div class="tabs" role="tablist">
        <button id="tabCMY" class="tab active" type="button">Parts CMY</button>
        <button id="tabFREE" class="tab" type="button">Couleurs libres</button>
      </div>
    </div>

    <div style="height:12px"></div>

    <div class="grid">
      <div class="card">
        <div id="viewer" class="viewer">
          <div class="badge">
            <span class="dot" id="dot"></span>
            <span id="hex">#FFFFFF</span>
            <span id="rgb">rgb(255,255,255)</span>
          </div>
          <div class="wbPanel badge">
            <div class="wbGroup">
              <button id="whiteMinus" class="wbBtn">− Blanc</button>
              <button id="whitePlus" class="wbBtn">+ Blanc</button>
              <span class="wbRead">(<span id="whitePct">0%</span>)</span>
            </div>
            <div class="wbGroup">
              <button id="blackMinus" class="wbBtn">− Noir</button>
              <button id="blackPlus" class="wbBtn">+ Noir</button>
              <span class="wbRead">(<span id="blackPct">0%</span>)</span>
            </div>
            <button id="reset" class="wbBtn">Reset</button>
          </div>
        </div>
      </div>

      <div class="controls">
        <div id="panelCMY" class="card">
          <h2 style="margin:0 0 10px 0; font-size:16px;">Parts CMY</h2>
          <div class="row">
            <div class="label"><span class="dot" style="background:cyan;"></span>Cyan</div>
            <input id="c" type="range" min="0" max="100" value="0" />
            <div class="value"><span id="cVal">0</span>%</div>
          </div>
          <div class="row">
            <div class="label"><span class="dot" style="background:magenta;"></span>Magenta</div>
            <input id="m" type="range" min="0" max="100" value="0" />
            <div class="value"><span id="mVal">0</span>%</div>
          </div>
          <div class="row">
            <div class="label"><span class="dot" style="background:gold;"></span>Jaune</div>
            <input id="y" type="range" min="0" max="100" value="0" />
            <div class="value"><span id="yVal">0</span>%</div>
          </div>
        </div>

        <div id="panelFREE" class="card hidden">
          <h2 style="margin:0 0 10px 0; font-size:16px;">Couleurs libres</h2>
          <div class="imgBox">
            <button id="imgUploadBtn">Uploader une image</button>
            <button id="imgDeleteBtn" class="hidden">Supprimer l’image</button>
            <input id="imgFile" type="file" accept="image/*" class="hidden" />
            <div class="imgCanvasWrap"><canvas id="imgCanvas"></canvas></div>
            <div class="mini" id="imgHint">Chargez une image pour échantillonner.</div>
          </div>
          <div id="swatches" class="swatches"></div>
          <div class="addRow">
            <button id="addColorBtn">+ Ajouter</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const clamp01 = (x) => Math.min(1, Math.max(0, x));
    const clamp255 = (x) => Math.min(255, Math.max(0, Math.round(x)));

    // --- SENDER POUR SAFARI / MOODLE ---
    function sendHeight() {
      // Un court délai permet à Safari de mettre à jour le layout DOM
      setTimeout(() => {
        const wrap = $('mainWrap');
        if (wrap) {
          // getBoundingClientRect est plus fiable sur Safari pour les hauteurs dynamiques
          const h = wrap.getBoundingClientRect().height;
          window.parent.postMessage({ type: "cmy-resize", height: Math.ceil(h) + 30 }, "*");
        }
      }, 60);
    }

    // Observe les changements de taille (onglets, images, contenu)
    const ro = new ResizeObserver(() => sendHeight());
    ro.observe($('mainWrap'));
    window.addEventListener("resize", sendHeight);

    const state = {
      mode: "CMY",
      c: 0, m: 0, y: 0,
      colors: [{ hex: null, part: 0 }, { hex: null, part: 0 }, { hex: null, part: 0 }],
      targetColorIndex: 0,
      white: 0, black: 0, step: 0.05, imgLoaded: false
    };

    function cmyToRgb(c, m, y){ return { r: 255*(1-c), g: 255*(1-m), b: 255*(1-y) }; }
    function hexToRgb(hex){ 
      const h = hex.replace("#",""); 
      return { r: parseInt(h.slice(0,2),16), g: parseInt(h.slice(2,4),16), b: parseInt(h.slice(4,6),16) }; 
    }
    function mixFree(colors){
      let sum = 0, r = 0, g = 0, b = 0;
      for (const c of colors){
        if (!c.hex || c.part <= 0) continue;
        const rgb = hexToRgb(c.hex);
        sum += c.part; r += rgb.r*c.part; g += rgb.g*c.part; b += rgb.b*c.part;
      }
      return sum <= 0 ? {r:255,g:255,b:255} : { r:r/sum, g:g/sum, b:b/sum };
    }
    function applyWhiteBlack(rgb, white, black){
      let r = rgb.r + (255 - rgb.r) * white;
      let g = rgb.g + (255 - rgb.g) * white;
      let b = rgb.b + (255 - rgb.b) * white;
      r *= (1-black); g *= (1-black); b *= (1-black);
      return { r: clamp255(r), g: clamp255(g), b: clamp255(b) };
    }
    function rgbToHex({r,g,b}){
      const toH = (n) => n.toString(16).padStart(2,"0");
      return ("#" + toH(r) + toH(g) + toH(b)).toUpperCase();
    }

    function render(){
      $('cVal').textContent = state.c; $('mVal').textContent = state.m; $('yVal').textContent = state.y;
      const base = state.mode === "CMY" ? cmyToRgb(state.c/100, state.m/100, state.y/100) : mixFree(state.colors);
      const out = applyWhiteBlack(base, state.white, state.black);
      const hex = rgbToHex(out);
      $('viewer').style.background = hex;
      $('dot').style.background = hex;
      $('hex').textContent = hex;
      $('rgb').textContent = `rgb(${out.r},${out.g},${out.b})`;
      $('whitePct').textContent = Math.round(state.white*100) + "%";
      $('blackPct').textContent = Math.round(state.black*100) + "%";
    }

    function setMode(m){
      state.mode = m;
      const isC = m === "CMY";
      $('tabCMY').classList.toggle("active", isC);
      $('tabFREE').classList.toggle("active", !isC);
      $('panelCMY').classList.toggle("hidden", !isC);
      $('panelFREE').classList.toggle("hidden", isC);
      render();
    }

    $('tabCMY').onclick = () => setMode("CMY");
    $('tabFREE').onclick = () => setMode("FREE");
    $('c').oninput = (e) => { state.c = Number(e.target.value); render(); };
    $('m').oninput = (e) => { state.m = Number(e.target.value); render(); };
    $('y').oninput = (e) => { state.y = Number(e.target.value); render(); };
    $('whitePlus').onclick = () => { state.white = clamp01(state.white + 0.05); render(); };
    $('whiteMinus').onclick = () => { state.white = clamp01(state.white - 0.05); render(); };
    $('blackPlus').onclick = () => { state.black = clamp01(state.black + 0.05); render(); };
    $('blackMinus').onclick = () => { state.black = clamp01(state.black - 0.05); render(); };

    function renderSwatches(){
      const s = $('swatches'); s.innerHTML = "";
      state.colors.forEach((c, i) => {
        const card = document.createElement("div");
        card.className = "colorCard";
        card.innerHTML = `
          <div class="colorHeader">
            <button class="colorBtn ${i===state.targetColorIndex?'selected':''}" id="btn-${i}">
              <span class="chip" style="background:${c.hex||'#eee'}"></span>
              <span class="titleText">${c.hex||'Vide'}</span>
            </button>
            <div class="partInline">
              <span class="partLabel">Part</span>
              <input type="range" class="partRange" value="${c.part}" id="rng-${i}">
              <span class="partPct">${c.part}%</span>
            </div>
            <button class="delBtn" id="del-${i}">✕</button>
          </div>
          <input type="color" class="hidden" id="pk-${i}" value="${c.hex||'#ffffff'}">
        `;
        s.appendChild(card);
        $(`btn-${i}`).onclick = () => { state.targetColorIndex = i; renderSwatches(); $(`pk-${i}`).click(); };
        $(`pk-${i}`).oninput = (e) => { state.colors[i].hex = e.target.value; state.colors[i].part = 100; renderSwatches(); render(); };
        
        // --- FIX : On met à jour sans redessiner toute la liste (renderSwatches) ---
        $(`rng-${i}`).oninput = (e) => { 
          const val = Number(e.target.value);
          state.colors[i].part = val;
          // Met à jour le texte du % (l'élément suivant l'input)
          e.target.nextElementSibling.textContent = val + "%"; 
          render(); 
        };

        $(`del-${i}`).onclick = () => { if(state.colors.length>1) { state.colors.splice(i,1); renderSwatches(); render(); }};
      });
    }

    $('addColorBtn').onclick = () => { state.colors.push({hex:null, part:0}); renderSwatches(); };

    const imgFile = $('imgFile');
    $('imgUploadBtn').onclick = () => imgFile.click();
    imgFile.onchange = (e) => {
      const f = e.target.files[0]; if(!f) return;
      const url = URL.createObjectURL(f); const img = new Image();
      img.onload = () => {
        const c = $('imgCanvas'); const ctx = c.getContext('2d');
        const w = c.parentElement.clientWidth; const scale = w/img.width;
        c.width = w; c.height = img.height*scale;
        ctx.drawImage(img, 0,0, c.width, c.height);
        state.imgLoaded = true; $('imgDeleteBtn').classList.remove('hidden');
      };
      img.src = url;
    };

    $('imgCanvas').onclick = (e) => {
      if(!state.imgLoaded) return;
      const rect = $('imgCanvas').getBoundingClientRect();
      const x = e.clientX - rect.left; const y = e.clientY - rect.top;
      const data = $('imgCanvas').getContext('2d').getImageData(x, y, 1, 1).data;
      state.colors[state.targetColorIndex].hex = rgbToHex({r:data[0], g:data[1], b:data[2]});
      state.colors[state.targetColorIndex].part = 100;
      renderSwatches(); render();
    };

    $('reset').onclick = () => location.reload();

    renderSwatches(); render();
  </script>
</body>
</html>
