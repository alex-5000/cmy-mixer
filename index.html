<div style="width: 100%; overflow: hidden;">
  <iframe id="cmyFrame" 
    src="https://alex-5000.github.io/cmy-mixer/" 
    style="border: 0; width: 100%; min-height: 500px; transition: height 0.2s ease-out;" 
    frameborder="0" 
    scrolling="no">
  </iframe>
</div>

<script>
  (function() {
    var iframeElement = document.getElementById('cmyFrame');
    
    window.addEventListener('message', function(event) {
      // Sécurité : Vérifiez que le message contient bien nos données de redimensionnement
      if (event.data && event.data.type === 'cmy-resize') {
        var newHeight = event.data.height;
        if (iframeElement && newHeight > 0) {
          iframeElement.style.height = newHeight + 'px';
        }
      }
    }, false);

    // Safari Fix : Renvoi d'un ping au chargement pour forcer le premier calcul
    iframeElement.onload = function() {
      setTimeout(function() {
        iframeElement.contentWindow.postMessage('ping', '*');
      }, 500);
    };
  })();
</script>
